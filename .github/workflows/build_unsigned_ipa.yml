name: Build iSH-AOK for TrollStore
on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: 拉取代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 安装依赖工具（LLVM/lld/meson）
        run: |
          brew update > /dev/null 2>&1
          brew install llvm pipx

          echo "PATH=$(brew --prefix llvm)/bin:$PATH" >> $GITHUB_ENV
          echo "CC=$(brew --prefix llvm)/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> $GITHUB_ENV
          echo "LD=$(brew --prefix llvm)/bin/lld" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix llvm)/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$(brew --prefix llvm)/include" >> $GITHUB_ENV

          pipx install meson
          pipx ensurepath

      - name: 编译 iSH-AOK（无签名）
        run: |
          # 直接在命令行中构造 MESON_COMMAND，避免 YAML 多行字符串带来的问题
          xcodebuild build \
            -project iSH-AOK.xcodeproj \
            -target iSH-AOK \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            SYMROOT=./build \
            MESON_ARGS="-Dvdso=disabled -Drt=disabled" \
            MESON_COMMAND="$(which meson) --native-file <(echo -e '[binaries]\nld = \"'$LD'\"')"

      - name: 打包为无签名 IPA（适配 TrollStore）
        run: |
          APP_PATH="./build/Release-iphoneos/iSH-AOK.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "错误：未找到编译后的 .app 文件"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q iSH-AOK-TrollStore.ipa Payload/
          rm -rf Payload

      - name: 上传 IPA 产物（保留7天）
        uses: actions/upload-artifact@v4
        with:
          name: iSH-AOK-Unsigned-IPA
          path: ./iSH-AOK-TrollStore.ipa
          retention-days: 7
          if-no-files-found: error
