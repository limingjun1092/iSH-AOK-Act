name: Build iSH-AOK for TrollStore
on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: 拉取代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 安装必要依赖
        run: |
          brew update > /dev/null 2>&1
          brew install llvm meson

      - name: 关键修复：修改 Xcode 项目的 Meson 构建脚本
        run: |
          # 定义要插入的 Meson 参数
          # -Dvdso=disabled: 禁用 VDSO 构建
          # -Drt=disabled: 禁用 librt 链接
          MESON_EXTRA_ARGS="-Dvdso=disabled -Drt=disabled"

          # 使用 sed 命令直接修改 Xcode 项目中的 Run Script 内容
          # 这个脚本位于 libish 目标的 Build Phases 中
          # 我们在 meson setup 命令后插入我们的额外参数
          sed -i '' "s|\$(MESON_COMMAND) setup|\$(MESON_COMMAND) setup $MESON_EXTRA_ARGS|g" \
              iSH-AOK.xcodeproj/project.pbxproj

      - name: 编译 iSH-AOK（无签名）
        run: |
          xcodebuild build \
            -project iSH-AOK.xcodeproj \
            -target iSH-AOK \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            SYMROOT=./build

      - name: 打包为无签名 IPA
        run: |
          APP_PATH="./build/Release-iphoneos/iSH-AOK.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "错误：未找到编译后的 .app 文件"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q iSH-AOK-TrollStore.ipa Payload/
          rm -rf Payload

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: iSH-AOK-TrollStore-IPA
          path: ./iSH-AOK-TrollStore.ipa
          retention-days: 7
          if-no-files-found: error
