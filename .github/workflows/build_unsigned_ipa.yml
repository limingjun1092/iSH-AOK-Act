name: Build iSH-AOK Unsigned IPA for TrollStore
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 编译并生成.app
        run: |
          xcodebuild build \
            -project ish.xcodeproj \
            -scheme ish \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            SYMROOT=./build

      - name: 打包为无签名IPA
        run: |
          mkdir -p Payload
          cp -R ./build/Release-iphoneos/ish.app Payload/
          zip -r iSH-AOK-Unsigned.ipa Payload/
          rm -rf Payload

      - name: 上传IPA产物
        uses: actions/upload-artifact@v4
        with:
          name: iSH-AOK-Unsigned-IPA
          path: ./iSH-AOK-Unsigned.ipa
          retention-days: 7
