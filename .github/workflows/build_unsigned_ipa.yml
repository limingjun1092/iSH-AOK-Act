name: Build iSH-AOK for TrollStore
on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: 拉取代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 安装依赖工具
        run: |
          # 更新 Homebrew
          brew update > /dev/null 2>&1

          # 安装核心工具：LLVM (提供 clang, lld) 和 meson
          brew install llvm meson

          # 配置环境变量，将 LLVM 工具链放在最前面
          echo "PATH=$(brew --prefix llvm)/bin:$PATH" >> $GITHUB_ENV
          echo "CC=$(brew --prefix llvm)/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> $GITHUB_ENV
          echo "LD=$(brew --prefix llvm)/bin/lld" >> $GITHUB_ENV
          echo "AR=$(brew --prefix llvm)/bin/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB=$(brew --prefix llvm)/bin/llvm-ranlib" >> $GITHUB_ENV

      - name: 生成 Meson 工具链配置文件
        run: |
          # 创建一个 meson 工具链文件，明确指定所有工具
          # 这可以确保 meson 在构建 libish 时使用我们指定的 LLVM 工具链
          cat > meson-cross-file.ini << EOF
          [binaries]
          c = '${{ env.CC }}'
          cxx = '${{ env.CXX }}'
          ld = '${{ env.LD }}'
          ar = '${{ env.AR }}'
          ranlib = '${{ env.RANLIB }}'
          strip = '$(brew --prefix llvm)/bin/llvm-strip'

          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      - name: 编译 iSH-AOK（无签名）
        run: |
          # 清理之前的构建产物，确保环境干净
          xcodebuild clean \
            -project iSH-AOK.xcodeproj \
            -target iSH-AOK \
            -configuration Release

          # 执行构建
          xcodebuild build \
            -project iSH-AOK.xcodeproj \
            -target iSH-AOK \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            SYMROOT=./build \
            # 核心：禁用 VDSO，这是避免所有复杂问题的关键
            # 同时禁用 rt 库，因为 macOS 没有
            MESON_ARGS="-Dvdso=disabled -Drt=disabled" \
            # 将我们的工具链文件传递给 meson
            MESON_COMMAND="meson setup --cross-file ${{ github.workspace }}/meson-cross-file.ini"

      - name: 验证并打包 IPA
        run: |
          APP_PATH="./build/Release-iphoneos/iSH-AOK.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "错误：未找到编译后的 .app 文件！"
            exit 1
          fi

          echo "开始打包 IPA..."
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q iSH-AOK-TrollStore.ipa Payload/
          rm -rf Payload

          echo "IPA 打包完成：iSH-AOK-TrollStore.ipa"

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: iSH-AOK-TrollStore-IPA
          path: ./iSH-AOK-TrollStore.ipa
          retention-days: 7
          if-no-files-found: error
