name: Build iSH-AOK Unsigned IPA for TrollStore
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 编译并生成.app
        run: |
          xcodebuild build \
            -project iSH-AOK.xcodeproj \  # <--- 修正为正确的项目文件名
            -scheme iSH-AOK \             # <--- 修正为正确的 scheme 名称 (通常与项目名一致)
            -configuration Release \
            -sdk iphoneos \               # 指定 iOS SDK
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            SYMROOT=./build

      - name: 打包为无签名IPA
        run: |
          mkdir -p Payload
          # 确认 .app 文件名与 scheme 一致
          cp -R ./build/Release-iphoneos/iSH-AOK.app Payload/
          zip -r iSH-AOK-Unsigned.ipa Payload/
          rm -rf Payload

      - name: 上传IPA产物
        uses: actions/upload-artifact@v4
        with:
          name: iSH-AOK-Unsigned-IPA
          path: ./iSH-AOK-Unsigned.ipa
          retention-days: 7
