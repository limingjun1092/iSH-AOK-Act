name: Build iSH-AOK for TrollStore
on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: 拉取代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 安装依赖工具（LLVM/lld/meson）
        run: |
          # 更新 Homebrew 并安装核心工具
          brew update > /dev/null 2>&1
          brew install llvm pipx

          # 将 LLVM 工具链路径添加到环境变量
          echo "PATH=$(brew --prefix llvm)/bin:$PATH" >> $GITHUB_ENV
          echo "CC=$(brew --prefix llvm)/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> $GITHUB_ENV
          echo "LD=$(brew --prefix llvm)/bin/lld" >> $GITHUB_ENV

          # 安装 meson
          pipx install meson
          pipx ensurepath

      - name: 生成 Meson 静态配置文件（关键修复）
        run: |
          # 提前创建一个 native-file.ini，明确指定 lld 链接器的绝对路径
          # 这种方式比在命令行中动态生成更可靠，避免了各种解析问题
          echo -e "[binaries]\nld = '$(brew --prefix llvm)/bin/lld'" > ${{ github.workspace }}/meson-native.ini

      - name: 编译 iSH-AOK（无签名）
        run: |
          xcodebuild build \
            -project iSH-AOK.xcodeproj \
            -target iSH-AOK \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            SYMROOT=./build \
            # 禁用不需要的模块，解决依赖问题
            MESON_ARGS="-Dvdso=disabled -Drt=disabled" \
            # 直接使用提前准备好的静态配置文件
            MESON_COMMAND="$(which meson) --native-file ${{ github.workspace }}/meson-native.ini"

      - name: 打包为无签名 IPA（适配 TrollStore）
        run: |
          APP_PATH="./build/Release-iphoneos/iSH-AOK.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "错误：未找到编译后的 .app 文件"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q iSH-AOK-TrollStore.ipa Payload/
          rm -rf Payload

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: iSH-AOK-TrollStore-IPA
          path: ./iSH-AOK-TrollStore.ipa
          retention-days: 7
          if-no-files-found: error
