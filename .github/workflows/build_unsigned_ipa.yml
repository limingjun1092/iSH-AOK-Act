name: Build iSH-AOK for TrollStore

on:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: 拉取代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: 强制清理+重建目录（彻底干净环境）
        run: |
          rm -rf ./build ./deps/build ./Payload ./iSH-AOK-TrollStore.ipa
          mkdir -p ./build ./deps/build
          xattr -w com.apple.xcode.CreatedByBuildSystem true ./build ./deps/build

      - name: 安装稳定依赖（修正 Meson 安装方式）
        run: |
          brew update > /dev/null 2>&1
          # 卸载可能冲突的旧版本
          brew uninstall --force llvm meson || true
          # 安装最新版 llvm@16 和 meson（去掉 meson 版本号）
          brew install llvm@16 meson
          # 强制链接指定版本
          brew link --force llvm@16 meson
          # 配置工具链环境变量
          echo "PATH=$(brew --prefix llvm@16)/bin:$(brew --prefix meson)/bin:$PATH" >> $GITHUB_ENV
          echo "CFLAGS=-fno-modules" >> $GITHUB_ENV
          echo "CXXFLAGS=-fno-modules" >> $GITHUB_ENV

      - name: 编译 iSH-AOK（正确传递 Meson 参数）
        run: |
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          xcodebuild build \
            -project iSH-AOK.xcodeproj \
            -target iSH-AOK \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            SYMROOT=./build \
            ONLY_ACTIVE_ARCH=YES \
            CLANG_ENABLE_MODULES=NO \
            ENABLE_BITCODE=NO \
            MESON_ARGS="-Dvdso=disabled -Drt=disabled -Dmodules=disabled"

      - name: 验证+打包 IPA（容错机制）
        run: |
          APP_PATH="./build/Release-iphoneos/iSH-AOK.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "错误：未找到编译产物，请检查日志"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q iSH-AOK-TrollStore.ipa Payload/
          rm -rf Payload
          echo "IPA 打包成功：$(ls -lh iSH-AOK-TrollStore.ipa)"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: iSH-AOK-TrollStore-IPA
          path: ./iSH-AOK-TrollStore.ipa
          retention-days: 7
          if-no-files-found: error
