name: Build for TrollStore
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 安装依赖工具
        run: |
          # 安装 LLVM (包含 lld 链接器)
          brew install llvm pipx
          
          # 将 LLVM 工具链添加到 PATH 中
          echo "PATH=$(brew --prefix llvm)/bin:$PATH" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix llvm)/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$(brew --prefix llvm)/include" >> $GITHUB_ENV
          
          # 安装 Meson
          pipx ensurepath
          pipx install meson

      - name: Build
        run: |
          xcodebuild build \
            -project iSH-AOK.xcodeproj \
            -target iSH-AOK \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            SYMROOT=./build \
            # 关键: 告诉 Meson 在 macOS 上忽略 librt
            MESON_ARGS="-Drt=disabled"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/iSH-AOK.app Payload/
          zip -r iSH-AOK-TrollStore.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: iSH-AOK-TrollStore
          path: iSH-AOK-TrollStore.ipa
