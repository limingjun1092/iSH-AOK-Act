name: Build iSH-AOK (Simple) Unsigned IPA for TrollStore
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: 拉取代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: 编译生成.app（无签名，直接使用 Target 名称）
        working-directory: ${{ github.workspace }}
        run: |
          xcodebuild build \
            -project iSH-AOK.xcodeproj \
            -target "iSH-AOK" \                # <--- 直接指定 Target 名称
            -configuration "Release" \          # <--- 使用默认的 Release 配置
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="arm64" \
            SYMROOT=./build

      - name: 打包为无签名IPA
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p Payload
          # .app 名称应与 Target 名称一致
          cp -R ./build/Release-iphoneos/iSH-AOK.app Payload/
          zip -r iSH-AOK-Simple-Unsigned.ipa Payload/
          rm -rf Payload

      - name: 上传IPA产物
        uses: actions/upload-artifact@v4
        with:
          name: iSH-AOK-Simple-Unsigned-IPA
          path: ${{ github.workspace }}/iSH-AOK-Simple-Unsigned.ipa
          retention-days: 7
