name: Build Unsigned IPA for TrollStore

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build .xcarchive
      run: |
        xcodebuild archive \
          -project iSH.xcodeproj \
          -scheme iSH \
          -configuration Release \
          -archivePath build/iSH.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Package into IPA
      run: |
        # 创建一个临时目录结构
        mkdir -p Payload
        # 将未签名的 .app 包复制到 Payload 目录中
        cp -R build/iSH.xcarchive/Products/Applications/iSH.app Payload/
        # 将 Payload 目录打包成 IPA
        zip -r iSH-AOK-unsigned.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v3
      with:
        name: iSH-AOK-Unsigned-IPA
        path: iSH-AOK-unsigned.ipa
